name: scannerbot
description: "SCANNER BOT"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase & Database
  firebase_core: ^3.12.0
  firebase_database: ^11.3.0

  # UI, Permissions & Utilities
  cupertino_icons: ^1.0.8
  permission_handler: ^11.3.1
  shared_preferences: ^2.5.3
  shared_preferences_android: ">=2.4.28 <2.5.0"
  flutter_overlay_window: ^0.5.0

  # AI & Networking Tools (Gemini & Image Picker)
  http: ^1.2.0
  image_picker: ^1.0.7
  google_generative_ai: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    
    - assets/images/7.png
    - assets/images/8.jpg

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/8.jpg"
