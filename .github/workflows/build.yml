
name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ด
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบไฟล์โปรเจกต์
      - name: Validate project
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/images/8.jpg
          echo "Project files verified."

      # 5. ซ่อม Gradle Wrapper และกำหนดเวอร์ชัน 8.14.0
      - name: Repair Android Gradle Wrapper
        shell: bash
        run: |
          set -e

          if [ ! -f android/gradlew ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.properties ] || \
             [ ! -f android/gradle/wrapper/gradle-wrapper.jar ]; then

            echo "Generating temporary Android template."

            flutter create \
              --platforms=android \
              --org com.scannerbot \
              --project-name scannerbot \
              /tmp/scannerbot_template

            mkdir -p android/gradle/wrapper

            cp /tmp/scannerbot_template/android/gradlew \
              android/gradlew

            cp /tmp/scannerbot_template/android/gradlew.bat \
              android/gradlew.bat

            cp /tmp/scannerbot_template/android/gradle/wrapper/gradle-wrapper.jar \
              android/gradle/wrapper/gradle-wrapper.jar

            if [ ! -f android/gradle/wrapper/gradle-wrapper.properties ]; then
              cp /tmp/scannerbot_template/android/gradle/wrapper/gradle-wrapper.properties \
                android/gradle/wrapper/gradle-wrapper.properties
            fi
          fi

          chmod +x android/gradlew

          # กำหนด Gradle เป็น 8.14.0
          sed -i -E \
            's#gradle-[0-9][^/]*-(all|bin)\.zip#gradle-8.14.0-\1.zip#' \
            android/gradle/wrapper/gradle-wrapper.properties

          # ตรวจสอบไฟล์และเวอร์ชัน
          grep -q 'gradle-8.14.0-bin.zip' \
            android/gradle/wrapper/gradle-wrapper.properties

          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/gradle/wrapper/gradle-wrapper.properties

          echo "===== Gradle Wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

          cd android
          ./gradlew --version

      # 6. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 7. ดาวน์โหลด dependencies
      - name: Get dependencies
        run: flutter pub get

      # 8. สร้างไอคอนจากรูป 8.jpg
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # 9. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 10. ตรวจสอบ APK และลายเซ็น
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | head -n 20

          ls -lh "$APK"

      # 11. อัปโหลด APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SCANNER
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
