name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ดเดิมจาก GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบเวอร์ชัน
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version

      # 5. สำรองไฟล์ Manifest เดิม
      - name: Preserve Android manifest
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          fi

      # 6. สร้างโครงสร้าง Android มาตรฐาน
      - name: Generate Android scaffold
        run: |
          flutter create \
            --platforms=android \
            --org com.scannerbot \
            --project-name scannerbot \
            /tmp/scannerbot_template

          mkdir -p android
          cp -R /tmp/scannerbot_template/android/. android/

          if [ -f /tmp/AndroidManifest.xml ]; then
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      # 7. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 8. ดาวน์โหลดแพ็กเกจ
      - name: Get dependencies
        run: flutter pub get

      # 9. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 10. อัปโหลด APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SCANNER-BOT
          path: build/app/outputs/flutter-apk/app-release.v2.apk
          if-no-files-found: error
