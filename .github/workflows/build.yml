name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 1. ติดตั้ง Flutter SDK
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'
          
      # 2. เคลียร์ค่าแคชและไฟล์เก่าทั้งหมด
      - run: flutter clean
      
      # 3. สร้างโครงสร้างโปรเจกต์ Android ที่ถูกต้องใหม่ทั้งหมด
      - run: flutter create . --org com.scannerbot --project-name scannerbot --platforms=android
      
      # 4. ดึงแพ็กเกจ
      - run: flutter pub get
      
      # 5. สั่งคอมไพล์สร้างไฟล์ APK
      - run: flutter build apk --release
      
      # 6. อัปโหลดไฟล์ APK
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
