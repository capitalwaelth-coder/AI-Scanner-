
name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ด
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบไฟล์โปรเจกต์
      - name: Validate project
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/images/8.jpg
          echo "Project files verified."

      # 5. ซ่อม Gradle Wrapper
      - name: Repair Android Gradle Wrapper
        shell: bash
        run: |
          set -e

          WRAPPER_DIR="android/gradle/wrapper"

          if [ ! -f android/gradlew ] || \
             [ ! -f "$WRAPPER_DIR/gradle-wrapper.jar" ]; then

            echo "Generating temporary Android template."

            flutter create \
              --platforms=android \
              --org com.scannerbot \
              --project-name scannerbot \
              /tmp/scannerbot_template

            mkdir -p "$WRAPPER_DIR"

            cp /tmp/scannerbot_template/android/gradlew \
              android/gradlew

            cp /tmp/scannerbot_template/android/gradlew.bat \
              android/gradlew.bat

            cp /tmp/scannerbot_template/android/gradle/wrapper/gradle-wrapper.jar \
              "$WRAPPER_DIR/gradle-wrapper.jar"
          fi

          chmod +x android/gradlew

          # เขียนไฟล์ properties ใหม่ทุกครั้ง
          cat > "$WRAPPER_DIR/gradle-wrapper.properties" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # ตรวจสอบไฟล์และค่าที่กำหนด
          test -f android/gradlew
          test -f "$WRAPPER_DIR/gradle-wrapper.jar"
          test -f "$WRAPPER_DIR/gradle-wrapper.properties"

          test "$(grep -c '^distributionBase=' "$WRAPPER_DIR/gradle-wrapper.properties")" -eq 1
          test "$(grep -c '^distributionPath=' "$WRAPPER_DIR/gradle-wrapper.properties")" -eq 1
          test "$(grep -c '^distributionUrl=' "$WRAPPER_DIR/gradle-wrapper.properties")" -eq 1

          grep -q 'gradle-8.14-bin.zip' \
            "$WRAPPER_DIR/gradle-wrapper.properties"

          echo "===== Gradle Wrapper ====="
          cat "$WRAPPER_DIR/gradle-wrapper.properties"

          # ตรวจสอบ Gradle
          cd android
          ./gradlew --version

      # 6. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 7. ดาวน์โหลด dependencies
      - name: Get dependencies
        run: flutter pub get

      # 8. สร้างไอคอนจากรูป 8.jpg
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # 9. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 10. ตรวจสอบ APK และลายเซ็น
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          test -n "$AAPT"
          "$AAPT" dump badging "$APK" | head -n 20

          ls -lh "$APK"

      # 11. อัปโหลด APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SCANNER
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
