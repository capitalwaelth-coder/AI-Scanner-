name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ด
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบไฟล์โปรเจกต์
      - name: Validate project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/images/8.jpg

          echo "===== Flutter version ====="
          flutter --version

          echo "===== Android application configuration ====="
          grep -nE 'namespace|applicationId|minSdk|targetSdk' \
            android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null || true

          echo "Project files verified."
   # 5. ตรวจสอบและซ่อม Gradle Wrapper
      - name: Repair Android Gradle Wrapper
        shell: bash
        run: |
          set -e

          WRAPPER_DIR="android/gradle/wrapper"
          PROPERTIES="$WRAPPER_DIR/gradle-wrapper.properties"

          mkdir -p "$WRAPPER_DIR"

          if [ ! -f "$PROPERTIES" ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            echo "Please restore this file from the original project."
            exit 1
          fi

          # อ่านเวอร์ชัน Gradle จากการตั้งค่าของโปรเจกต์
          GRADLE_URL=$(grep '^distributionUrl=' "$PROPERTIES" \
            | tail -n 1 \
            | cut -d '=' -f 2- \
            | sed 's/\\:/:/g')

          if [ -z "$GRADLE_URL" ]; then
            echo "ERROR: Gradle distribution URL not found."
            exit 1
          fi

          echo "Gradle URL: $GRADLE_URL"

          # ดาวน์โหลด Gradle Wrapper JAR จาก Gradle repository
          if [ ! -f "$WRAPPER_DIR/gradle-wrapper.jar" ]; then
            curl -fL --retry 3 \
              https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradle/wrapper/gradle-wrapper.jar \
              -o "$WRAPPER_DIR/gradle-wrapper.jar"
          fi

          # กู้สคริปต์ Wrapper จาก Template หากไม่มี
          if [ ! -f android/gradlew ]; then
            curl -fL --retry 3 \
              https://raw.githubusercontent.com/gradle/gradle/v8.14.0/gradlew \
              -o android/gradlew
          fi

          chmod +x android/gradlew

          test -s "$WRAPPER_DIR/gradle-wrapper.jar"
          test -s android/gradlew

          echo "Wrapper files checked."
          
      # 6. เปิดใช้ AndroidX โดยเก็บค่าที่มีอยู่
      - name: Ensure AndroidX
        shell: bash
        run: |
          set -e

          FILE="android/gradle.properties"
          touch "$FILE"

          if ! grep -qE '^[[:space:]]*android\.useAndroidX=' "$FILE"; then
            echo 'android.useAndroidX=true' >> "$FILE"
          fi

          echo "===== Gradle properties ====="
          cat "$FILE"

      # 7. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 8. ดาวน์โหลด Dependencies
      - name: Get dependencies
        run: flutter pub get

      # 9. สร้างไอคอนแอป
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # 10. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 11. ตรวจสอบ APK และข้อมูลแพ็กเกจ
      - name: Diagnose APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          echo "===== APK file ====="
          ls -lh "$APK"
          sha256sum "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "ERROR: Android build tools not found."
            exit 1
          fi

          echo "===== Package information ====="
          "$AAPT" dump badging "$APK" | head -n 20

          echo "===== Verify APK signature ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "===== APK signing schemes ====="
          "$APKSIGNER" verify --verbose "$APK"

          echo "APK passed signature verification."

      # 12. อัปโหลด APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SCANNER
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
