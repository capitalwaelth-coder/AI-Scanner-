name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ด
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบไฟล์โปรเจกต์
      - name: Validate project
        shell: bash
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/images/8.jpg
          echo "Project files verified."

      # 5. ซ่อม Gradle Wrapper
      - name: Repair Android Gradle Wrapper
        shell: bash
        run: |
          set -e

          WRAPPER_DIR="android/gradle/wrapper"

          if [ ! -f android/gradlew ] || \
             [ ! -f "$WRAPPER_DIR/gradle-wrapper.jar" ]; then

            echo "Generating temporary Android template."

            flutter create \
              --platforms=android \
              --org com.scannerbot \
              --project-name scannerbot \
              /tmp/scannerbot_template

            mkdir -p "$WRAPPER_DIR"

            cp /tmp/scannerbot_template/android/gradlew \
              android/gradlew

            cp /tmp/scannerbot_template/android/gradlew.bat \
              android/gradlew.bat

            cp /tmp/scannerbot_template/android/gradle/wrapper/gradle-wrapper.jar \
              "$WRAPPER_DIR/gradle-wrapper.jar"
          fi

          chmod +x android/gradlew

          cat > "$WRAPPER_DIR/gradle-wrapper.properties" <<'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.14-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          test -f android/gradlew
          test -f "$WRAPPER_DIR/gradle-wrapper.jar"
          test -f "$WRAPPER_DIR/gradle-wrapper.properties"

          test "$(grep -c '^distributionBase=' "$WRAPPER_DIR/gradle-wrapper.properties")" -eq 1
          test "$(grep -c '^distributionPath=' "$WRAPPER_DIR/gradle-wrapper.properties")" -eq 1
          test "$(grep -c '^distributionUrl=' "$WRAPPER_DIR/gradle-wrapper.properties")" -eq 1

          echo "===== Gradle Wrapper ====="
          cat "$WRAPPER_DIR/gradle-wrapper.properties"

          cd android
          ./gradlew --version

      # 6. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 7. สร้างธีม Android ที่ Manifest เรียกใช้
      - name: Fix Android Launch Themes
        shell: bash
        run: |
          set -e

          RES_DIR="android/app/src/main/res"
          mkdir -p "$RES_DIR/values"

          cat > "$RES_DIR/values/styles.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF

          echo "Created LaunchTheme and NormalTheme."
          cat "$RES_DIR/values/styles.xml"

      # 8. ดาวน์โหลด dependencies
      - name: Get dependencies
        run: flutter pub get

      # 9. สร้างไอคอนจากรูป 8.jpg
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # 10. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 11. วิเคราะห์ APK และลายเซ็น
      - name: Diagnose APK Signature
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK" ]; then
            echo "ERROR: APK file not found."
            exit 1
          fi

          echo "===== APK file ====="
          ls -lh "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "ERROR: Android build tools not found."
            exit 1
          fi

          echo "===== Android package information ====="
          "$AAPT" dump badging "$APK" | head -n 20

          echo "===== APK signing verification ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            || echo "WARNING: APK signature verification failed."

          echo "===== APK signing schemes ====="
          "$APKSIGNER" verify --verbose "$APK" \
            2>&1 || true

          echo "===== APK signing files ====="
          unzip -l "$APK" \
            | grep -E 'META-INF/|AndroidManifest.xml' \
            | head -n 40 || true

          echo "===== Diagnostic completed ====="

      # 12. อัปโหลด APK สำหรับตรวจสอบ
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SCANNER
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
