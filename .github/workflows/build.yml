name: Build Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
      - 'lib/**'
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ด
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบไฟล์โปรเจกต์
      - name: Validate project
        shell: bash
        run: |
          set -e

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/app/src/main/AndroidManifest.xml
          test -f assets/images/8.jpg

          echo "===== Flutter version ====="
          flutter --version

          echo "===== Android configuration ====="
          grep -nE 'namespace|applicationId|minSdk|targetSdk' \
            android/app/build.gradle \
            android/app/build.gradle.kts 2>/dev/null || true

          echo "Project files verified."

      # 5. ตรวจสอบ Gradle Wrapper
      - name: Repair Android Gradle Wrapper
        shell: bash
        run: |
          set -e

          WRAPPER_DIR="android/gradle/wrapper"
          PROPERTIES="$WRAPPER_DIR/gradle-wrapper.properties"

          mkdir -p "$WRAPPER_DIR"

          # สร้าง Wrapper จาก Template เฉพาะเมื่อไฟล์ขาด
          if [ ! -f android/gradlew ] || \
             [ ! -f "$WRAPPER_DIR/gradle-wrapper.jar" ] || \
             [ ! -f "$PROPERTIES" ]; then

            echo "Generating Gradle Wrapper from Flutter template."

            flutter create \
              --platforms=android \
              --org com.scannerbot \
              --project-name scannerbot \
              /tmp/scannerbot_template

            if [ ! -f android/gradlew ]; then
              cp /tmp/scannerbot_template/android/gradlew \
                android/gradlew
            fi

            if [ ! -f android/gradlew.bat ]; then
              cp /tmp/scannerbot_template/android/gradlew.bat \
                android/gradlew.bat
            fi

            if [ ! -f "$WRAPPER_DIR/gradle-wrapper.jar" ]; then
              cp /tmp/scannerbot_template/android/gradle/wrapper/gradle-wrapper.jar \
                "$WRAPPER_DIR/gradle-wrapper.jar"
            fi

            if [ ! -f "$PROPERTIES" ]; then
              cp /tmp/scannerbot_template/android/gradle/wrapper/gradle-wrapper.properties \
                "$PROPERTIES"
            fi
          fi

          chmod +x android/gradlew

          test -s android/gradlew
          test -s "$WRAPPER_DIR/gradle-wrapper.jar"
          test -s "$PROPERTIES"

          echo "===== Gradle Wrapper configuration ====="
          cat "$PROPERTIES"

          echo "===== Gradle version ====="
          cd android
          ./gradlew --version

      # 6. เปิดใช้ AndroidX
      - name: Ensure AndroidX
        shell: bash
        run: |
          set -e

          FILE="android/gradle.properties"
          touch "$FILE"

          if ! grep -qE '^[[:space:]]*android\.useAndroidX=' "$FILE"; then
            echo 'android.useAndroidX=true' >> "$FILE"
          fi

          echo "AndroidX configured."

      # 7. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 8. สร้างธีมที่ AndroidManifest.xml เรียกใช้
      - name: Ensure Android Launch Themes
        shell: bash
        run: |
          set -e

          RES_DIR="android/app/src/main/res"
          VALUES_DIR="$RES_DIR/values"
          STYLES="$VALUES_DIR/styles.xml"

          mkdir -p "$VALUES_DIR"

          # สร้างไฟล์ใหม่เมื่อไม่มีไฟล์เดิม
          if [ ! -f "$STYLES" ]; then
            cat > "$STYLES" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="LaunchTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">@android:color/white</item>
              </style>
              <style name="NormalTheme" parent="@android:style/Theme.Light.NoTitleBar">
                  <item name="android:windowBackground">?android:colorBackground</item>
              </style>
          </resources>
          EOF
          fi

          echo "===== Verify theme resources ====="
          cat "$STYLES"

          grep -q 'name="LaunchTheme"' "$STYLES"
          grep -q 'name="NormalTheme"' "$STYLES"

      # 9. ดาวน์โหลด Dependencies
      - name: Get dependencies
        run: flutter pub get

      # 10. สร้างไอคอนแอป
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # 11. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 12. ตรวจสอบ APK และลายเซ็น
      - name: Diagnose APK
        shell: bash
        run: |
          set -e

          APK="build/app/outputs/flutter-apk/app-release.apk"

          test -s "$APK"

          echo "===== APK file ====="
          ls -lh "$APK"
          sha256sum "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -name apksigner -type f | sort -V | tail -n 1)"

          AAPT="$(find "$ANDROID_HOME/build-tools" \
            -name aapt -type f | sort -V | tail -n 1)"

          if [ -z "$APKSIGNER" ] || [ -z "$AAPT" ]; then
            echo "ERROR: Android build tools not found."
            exit 1
          fi

          echo "===== Package information ====="
          "$AAPT" dump badging "$APK" | head -n 20

          echo "===== Verify APK signature ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          echo "APK passed signature verification."

      # 13. อัปโหลด APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SCANNER
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
