name: Build Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. ดาวน์โหลดโค้ดจาก GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. ติดตั้ง Java 17
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. ติดตั้ง Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: false

      # 4. ตรวจสอบเวอร์ชัน
      - name: Check Flutter and Dart
        run: |
          flutter --version
          dart --version

      # 5. สำรอง Manifest เดิม
      - name: Preserve Android manifest
        run: |
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          fi

      # 6. สร้างโครงสร้าง Android
      - name: Generate Android scaffold
        run: |
          flutter create \
            --platforms=android \
            --org com.scannerbot \
            --project-name scannerbot \
            /tmp/scannerbot_template

          mkdir -p android
          cp -R /tmp/scannerbot_template/android/. android/

          if [ -f /tmp/AndroidManifest.xml ]; then
            cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      # 7. ล้างไฟล์ Build เก่า
      - name: Clean project
        run: flutter clean

      # 8. ดาวน์โหลดแพ็กเกจ
      - name: Get dependencies
        run: flutter pub get

      # 9. ตรวจสอบรูปและติดตั้งเครื่องมือสร้างไอคอน
      - name: Install launcher icon generator
        run: |
          test -f assets/images/8.jpg
          dart pub global activate flutter_launcher_icons

      # 10. สร้างไอคอนจากรูป 8.jpg
      - name: Generate app launcher icons
        run: |
          dart pub global run flutter_launcher_icons:main

      # 11. สร้าง APK
      - name: Build release APK
        run: flutter build apk --release

      # 12. ตรวจสอบไฟล์ APK
      - name: Check APK file
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          ls -lh "$APK"

      # 13. ตรวจสอบลายเซ็นและข้อมูล APK
      - name: Diagnose APK signature
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"

          echo "===== APK FILE ====="
          ls -lh "$APK"
          file "$APK"

          echo "===== ANDROID BUILD TOOLS ====="
          find "$ANDROID_HOME/build-tools" -name apksigner -type f

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          echo "===== APK SIGNATURE CHECK ====="
          "$APKSIGNER" verify --verbose --print-certs "$APK" || true

          echo "===== APK PACKAGE INFO ====="
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          if [ -n "$AAPT" ]; then
            "$AAPT" dump badging "$APK" | head -n 20
          fi

      # 14. อัปโหลด APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-SCANNER
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
